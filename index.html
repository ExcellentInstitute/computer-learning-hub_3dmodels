<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Excellent Institute - Advanced Hardware Lab</title>
    
    <!-- High-Tech Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- 3D Engine for Hardware Components -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    
    <!-- External Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="lab-container">
        
        <!-- ========================================== -->
        <!-- 1. THE HIGH-TECH DESK ENVIRONMENT          -->
        <!-- ========================================== -->
        <div class="desk-environment">
            
            <!-- Left Studio Speaker -->
            <div class="speaker speaker-left" id="hl-speaker-l">
                <div class="speaker-tweeter"></div>
                <div class="speaker-woofer"></div>
            </div>

            <!-- The Advanced Ultrawide Monitor -->
            <div class="monitor-wrapper" id="hl-monitor-zone">
                <div class="monitor-bezel">
                    <div class="monitor-screen" id="monitor-screen">
                        
                        <!-- LAYER 1: BIOS / POST Boot Error Screen -->
                        <div id="screen-bios" class="screen-layer hidden">
                            <div class="bios-text" id="bios-text"></div>
                        </div>

                        <!-- LAYER 2: The New Boot/Loading Screen -->
                        <div id="screen-boot" class="screen-layer boot-env hidden">
                            <div class="boot-logo-wrapper">
                                <img src="assets/logo.png" alt="Excellent Institute" id="boot-logo" class="rotating-logo" 
                                     onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0NSIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMDBlNWZmIiBzdHJva2Utd2lkdGg9IjIiLz48L3N2Zz4='">
                            </div>
                            <div class="boot-text-pulse">LOADING EXCELLENT OS...</div>
                        </div>

                        <!-- LAYER 3: Desktop OS Environment -->
                        <div id="screen-desktop" class="screen-layer desktop-env hidden">
                            <div class="wave-grid-wallpaper"></div>
                            <div class="widget-panel">
                                <div class="widget">
                                    <span class="wid-label">CPU LOAD</span>
                                    <div class="wid-bar"><div class="wid-fill" id="wid-cpu-bar" style="width: 4%;"></div></div>
                                    <span class="wid-val" id="wid-cpu-val">4%</span>
                                </div>
                                <div class="widget">
                                    <span class="wid-label">RAM ALLOC</span>
                                    <div class="wid-bar"><div class="wid-fill" id="wid-ram-bar" style="width: 18%;"></div></div>
                                    <span class="wid-val" id="wid-ram-val">18%</span>
                                </div>
                                <div class="widget">
                                    <span class="wid-label">CORE TEMP</span>
                                    <span class="wid-val temp-val" id="wid-temp-val">40°C</span>
                                </div>
                                <div class="widget">
                                    <span class="wid-label">NETWORK</span>
                                    <span class="wid-val net-val" id="wid-net-val">1GBPS LINK</span>
                                </div>
                            </div>
                            <div class="os-watermark">EXCELLENT OS v2.0</div>
                        </div>

                        <!-- LAYER 4: Error & Failure Overlays (BSOD, CPU Freeze, etc.) -->
                        <div id="screen-error" class="screen-layer error-env hidden">
                            <div class="error-text" id="error-text"></div>
                        </div>

                        <!-- LAYER 5: GPU Glitch & Artifacting Overlay -->
                        <div id="gpu-glitch" class="screen-layer gpu-artifact hidden"></div>

                        <!-- Visual Glass Effects -->
                        <div class="crt-scanline"></div>
                        <div class="glass-reflection"></div>
                        <div id="power-led" class="power-led led-off"></div>
                    </div>
                    <div class="monitor-logo">EXCELLENT</div>
                </div>
                <!-- Monitor Stand -->
                <div class="monitor-stand-neck"><div class="neck-detail"></div></div>
                <div class="monitor-stand-base"></div>
            </div>

            <!-- The High-Tech PC Case (CPU Tower) -->
            <div class="pc-tower" id="pc-tower">
                <div class="tower-chassis">
                    <div class="tower-glass-panel" id="tower-glass">
                        <!-- X-Ray Physical Location Highlight Zones -->
                        <div class="xray-zone zone-psu" id="zone-PSU"></div>
                        <div class="xray-zone zone-hdd" id="zone-HDD"></div>
                        <div class="xray-zone zone-mb" id="zone-MotherboardBase">
                            <div class="xray-zone zone-cpu" id="zone-CPU"></div>
                            <div class="xray-zone zone-pump" id="zone-WaterPump"></div>
                            <div class="xray-zone zone-fan" id="zone-Fan"></div>
                            <div class="xray-zone zone-ram" id="zone-RAM"></div>
                            <div class="xray-zone zone-vrm" id="zone-VRM"></div>
                            <div class="xray-zone zone-gpu" id="zone-GPU"></div>
                            <div class="xray-zone zone-riser" id="zone-Riser"></div>
                            <div class="xray-zone zone-ssd" id="zone-SSD"></div>
                            <div class="xray-zone zone-m2" id="zone-M2Heatsink"></div>
                            <div class="xray-zone zone-chipset" id="zone-Chipset"></div>
                            <div class="xray-zone zone-cmos" id="zone-CMOS"></div>
                            <div class="xray-zone zone-tpm" id="zone-TPM"></div>
                            <div class="xray-zone zone-nic" id="zone-NIC"></div>
                            <div class="xray-zone zone-wifi" id="zone-WiFi"></div>
                            <div class="xray-zone zone-sound" id="zone-SoundCard"></div>
                            <div class="xray-zone zone-capture" id="zone-CaptureCard"></div>
                        </div>
                        <div class="xray-zone zone-odd" id="zone-ODD"></div>
                        <div class="xray-zone zone-front-io" id="zone-FrontPanel"></div>
                        <div class="xray-zone zone-usb3" id="zone-USB3"></div>
                        <div class="xray-zone zone-cables" id="zone-ATX24"></div>
                        <div class="xray-zone zone-cables-cpu" id="zone-EPS8"></div>
                        <div class="xray-zone zone-cables-sata" id="zone-SATA"></div>
                        <div class="xray-zone zone-rgb" id="zone-RGB"></div>
                    </div>
                </div>
            </div>

            <!-- Right Studio Speaker -->
            <div class="speaker speaker-right" id="hl-speaker-r">
                <div class="speaker-tweeter"></div>
                <div class="speaker-woofer"></div>
            </div>

            <!-- Desk Peripherals (Keyboard & Mouse) -->
            <div class="desk-surface">
                <div class="peripheral-keyboard" id="hl-keyboard">
                    <div class="kb-glow"></div>
                </div>
                <div class="peripheral-mouse" id="hl-mouse">
                    <div class="mouse-glow"></div>
                </div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 2. DATA INSPECTOR & 3D CHAMBER             -->
        <!-- ========================================== -->
        <div class="inspection-panel">
            <div class="data-display">
                <div class="select-wrapper">
                    <select id="component-selector" class="cyber-select">
                        <!-- Core Systems -->
                        <option value="PSU">Power Supply Unit (PSU)</option>
                        <option value="CPU">Central Processing Unit (CPU)</option>
                        <option value="RAM">Random Access Memory (RAM)</option>
                        <option value="GPU">Graphics Processing Unit (GPU)</option>
                        <option value="Fan">Cooling Fan</option>
                        
                        <!-- Storage -->
                        <option value="SSD">NVMe Solid State Drive</option>
                        <option value="HDD">Mechanical Hard Drive (HDD)</option>
                        <option value="ODD">Optical Disk Drive (CD/DVD)</option>
                        
                        <!-- Motherboard Infrastructure -->
                        <option value="Chipset">Motherboard Chipset</option>
                        <option value="VRM">VRM Heatsink</option>
                        <option value="CMOS">CMOS Battery</option>
                        <option value="TPM">Trusted Platform Module (TPM)</option>
                        
                        <!-- Power & Cabling -->
                        <option value="ATX24">24-pin Main Power Cable</option>
                        <option value="EPS8">8-pin CPU Power Cable</option>
                        <option value="SATA">SATA Data Cable</option>
                        
                        <!-- Networking & Expansion -->
                        <option value="NIC">Network Card (Ethernet)</option>
                        <option value="WiFi">Wi-Fi / Bluetooth Module</option>
                        <option value="SoundCard">Dedicated Sound Card</option>
                        <option value="CaptureCard">Video Capture Card</option>
                        <option value="Riser">PCIe Riser Cable</option>
                        
                        <!-- Customization & I/O -->
                        <option value="RGB">RGB Lighting Controller</option>
                        <option value="WaterPump">AIO Water Pump</option>
                        <option value="M2Heatsink">M.2 SSD Heatsink</option>
                        <option value="FrontPanel">Front Panel I/O</option>
                        <option value="USB3">USB 3.0 Header</option>
                    </select>
                </div>
                
                <div class="status-indicator">
                    <h2 id="comp-title">Central Processing Unit</h2>
                    <span id="comp-badge" class="badge badge-active">PROCESSING</span>
                </div>
                <!-- Explanations render here (Will be synced to buttons via JS!) -->
                <p id="comp-desc" class="typewriter-text">The central processor is executing logical instructions and managing the operating system lifecycle.</p>
                
            </div>

            <div class="model-chamber">
                <model-viewer id="component-3d-viewer" 
                              src="" 
                              alt="3D Hardware Component" 
                              auto-rotate 
                              camera-controls 
                              disable-zoom 
                              shadow-intensity="1"
                              exposure="1.2">
                </model-viewer>
                <div class="chamber-scanner"></div>
            </div>
        </div>

        <!-- ========================================== -->
        <!-- 3. MASSIVE 25-COMPONENT MOTHERBOARD GRID   -->
        <!-- ========================================== -->
        <div class="motherboard-section">
            <h3 class="section-title">Motherboard Interactive Interface</h3>
            
            <div id="motherboard-grid" class="motherboard-grid massive-grid">
                <div class="pcb-traces"></div>
                
                <!-- STANDARD NAMES APPLIED TO ALL BUTTONS -->
                <button class="cyber-btn plugged" data-component="PSU" id="btn-PSU"><span class="icon">🔌</span><span class="label">Power Supply</span></button>
                <button class="cyber-btn plugged" data-component="CPU" id="btn-CPU"><span class="icon">🧠</span><span class="label">CPU</span></button>
                <button class="cyber-btn plugged" data-component="RAM" id="btn-RAM"><span class="icon">📟</span><span class="label">RAM Memory</span></button>
                <button class="cyber-btn plugged" data-component="GPU" id="btn-GPU"><span class="icon">🎮</span><span class="label">Graphics Card</span></button>
                <button class="cyber-btn plugged" data-component="Fan" id="btn-Fan"><span class="icon">❄️</span><span class="label">Cooling Fan</span></button>
                
                <button class="cyber-btn plugged" data-component="SSD" id="btn-SSD"><span class="icon">🗡️</span><span class="label">NVMe SSD</span></button>
                <button class="cyber-btn plugged" data-component="HDD" id="btn-HDD"><span class="icon">💽</span><span class="label">Hard Drive</span></button>
                <button class="cyber-btn plugged" data-component="ODD" id="btn-ODD"><span class="icon">💿</span><span class="label">Optical Drive</span></button>
                
                <button class="cyber-btn plugged" data-component="Chipset" id="btn-Chipset"><span class="icon">🔳</span><span class="label">Chipset</span></button>
                <button class="cyber-btn plugged" data-component="VRM" id="btn-VRM"><span class="icon">🛡️</span><span class="label">VRM Heatsink</span></button>
                <button class="cyber-btn plugged" data-component="CMOS" id="btn-CMOS"><span class="icon">🔋</span><span class="label">CMOS Battery</span></button>
                <button class="cyber-btn plugged" data-component="TPM" id="btn-TPM"><span class="icon">🔐</span><span class="label">Security (TPM)</span></button>
                
                <button class="cyber-btn plugged" data-component="ATX24" id="btn-ATX24"><span class="icon">🐍</span><span class="label">24-pin Power</span></button>
                <button class="cyber-btn plugged" data-component="EPS8" id="btn-EPS8"><span class="icon">⚡</span><span class="label">8-pin CPU Pwr</span></button>
                <button class="cyber-btn plugged" data-component="SATA" id="btn-SATA"><span class="icon">🔗</span><span class="label">SATA Cable</span></button>
                
                <button class="cyber-btn plugged" data-component="NIC" id="btn-NIC"><span class="icon">🌐</span><span class="label">Network Card</span></button>
                <button class="cyber-btn plugged" data-component="WiFi" id="btn-WiFi"><span class="icon">📶</span><span class="label">Wi-Fi Module</span></button>
                <button class="cyber-btn plugged" data-component="SoundCard" id="btn-SoundCard"><span class="icon">🔊</span><span class="label">Sound Card</span></button>
                <button class="cyber-btn plugged" data-component="CaptureCard" id="btn-CaptureCard"><span class="icon">📹</span><span class="label">Capture Card</span></button>
                <button class="cyber-btn plugged" data-component="Riser" id="btn-Riser"><span class="icon">🎢</span><span class="label">PCIe Riser</span></button>
                
                <button class="cyber-btn plugged" data-component="RGB" id="btn-RGB"><span class="icon">🌈</span><span class="label">RGB Lights</span></button>
                <button class="cyber-btn plugged" data-component="WaterPump" id="btn-WaterPump"><span class="icon">💧</span><span class="label">Water Pump</span></button>
                <button class="cyber-btn plugged" data-component="M2Heatsink" id="btn-M2Heatsink"><span class="icon">🧊</span><span class="label">SSD Heatsink</span></button>
                <button class="cyber-btn plugged" data-component="FrontPanel" id="btn-FrontPanel"><span class="icon">🔘</span><span class="label">Front Buttons</span></button>
                <button class="cyber-btn plugged" data-component="USB3" id="btn-USB3"><span class="icon">🔌</span><span class="label">USB Headers</span></button>
                
            </div>
        </div>

    </div>
    
    <!-- Global Container for High-Quality Spark/Explosion Animations -->
    <div id="global-spark-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999;"></div>

    <script src="script.js"></script>
</body>
</html>
